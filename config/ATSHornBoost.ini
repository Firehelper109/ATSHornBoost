[input]
; Windows virtual-key codes, decimal.
; 87 = W. IMPORTANT: unbind W from ATS's normal Accelerate control first.
drive_virtual_key=87

; 72 = H. Keep H bound to Horn in ATS so one key both honks and boosts.
trigger_virtual_key=72
require_game_foreground=1

[drive]
; Reduced analog throttle used while W is held and H is NOT held.
; Suggested starting points:
;   Horn Boost 10K N-m engine: 0.25
;   Horn Boost 25K N-m engine: 0.10
;   Horn Boost 50K N-m engine: 0.05
normal_throttle=0.10

[boost]
; Full analog throttle while H is held.
; Keep between 0.0 and 1.0. 1.0 = 100% throttle.
semantic_throttle=1.0

; Reserved for a future true force/velocity backend.
strength=25.0

[debug]
verbose_telemetry=0
